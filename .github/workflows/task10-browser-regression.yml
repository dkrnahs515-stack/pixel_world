name: Task 10 browser regression

on:
  push:
    branches: ["feature/pixel-core-sanctuary"]
    paths:
      - ".github/workflows/task10-browser-regression.yml"

permissions:
  contents: write

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-core-sanctuary
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Apply regression migration
        run: python .github/scripts/task10_browser_regression_patch.py
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run existing browser regression on sanctuary entry
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/pixel-world-server.log 2>&1 &
          PIXEL_WORLD_URL=http://127.0.0.1:4173 node tests/solo-mode-smoke.cjs
          PIXEL_WORLD_URL=http://127.0.0.1:4173 node tests/browser-smoke.cjs
          PIXEL_WORLD_URL=http://127.0.0.1:4173 node tests/chat-game-smoke.cjs
          PIXEL_WORLD_URL=http://127.0.0.1:4173 node tests/coast-browser-smoke.cjs
          PIXEL_WORLD_URL=http://127.0.0.1:4173 node tests/volcano-browser-smoke.cjs
          PIXEL_WORLD_URL=http://127.0.0.1:4173 node tests/combat-growth-browser.cjs
          node tests/reward-browser-smoke.cjs
      - name: Commit migrated browser regression
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser-smoke.cjs tests/chat-game-smoke.cjs tests/coast-browser-smoke.cjs tests/volcano-browser-smoke.cjs tests/combat-growth-browser.cjs tests/reward-browser-smoke.cjs
          git commit -m "test: migrate browser regression to sanctuary release"
          git push origin HEAD:feature/pixel-core-sanctuary
