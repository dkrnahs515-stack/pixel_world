name: Task 10 onboarding docs

on:
  push:
    branches: ["feature/pixel-core-sanctuary"]
    paths:
      - ".github/workflows/task10-onboarding-docs.yml"

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-core-sanctuary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch approved design and Task 10 plan
        run: python .github/scripts/task10_onboarding_docs_patch.py
      - name: Commit documentation update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-09-09-pixel-core-sanctuary-design.md docs/superpowers/plans/2026-09-10-pixel-core-sanctuary.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: expand Task 10 first-player journey"
          git push origin HEAD:feature/pixel-core-sanctuary
