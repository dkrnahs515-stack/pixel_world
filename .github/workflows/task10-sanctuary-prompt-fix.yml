name: Task 10 sanctuary prompt smoke fix

on:
  push:
    branches: ["feature/pixel-core-sanctuary"]
    paths:
      - ".github/workflows/task10-sanctuary-prompt-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-core-sanctuary
          fetch-depth: 0
      - name: Use current NPC prompt API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/sanctuary-browser-smoke.cjs')
          s = p.read_text()
          old = 'game.updateNearbyNpcPrompt();'
          new = 'game.updateNpcPrompt();'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale prompt call, found {count}')
          s = s.replace(old, new, 1)
          if old in s:
              raise SystemExit('stale prompt API remains')
          p.write_text(s)
          PY
          node --check tests/sanctuary-browser-smoke.cjs
          grep -q 'game.updateNpcPrompt();' tests/sanctuary-browser-smoke.cjs
      - name: Commit test harness fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/sanctuary-browser-smoke.cjs
          git commit -m "test: use current sanctuary NPC prompt API"
          git push origin HEAD:feature/pixel-core-sanctuary
