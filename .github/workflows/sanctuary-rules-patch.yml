name: Sanctuary rules patch

on:
  push:
    branches:
      - feature/pixel-core-sanctuary
    paths:
      - scripts/patch-sanctuary-rules.cjs
      - .github/workflows/sanctuary-rules-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-core-sanctuary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/patch-sanctuary-rules.cjs
      - name: Commit generated rules
        run: |
          if git diff --quiet -- database.rules.json; then
            echo "Rules already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.rules.json
          git commit -m "feat: extend firebase rules for sanctuary origin"
          git push origin HEAD:feature/pixel-core-sanctuary
