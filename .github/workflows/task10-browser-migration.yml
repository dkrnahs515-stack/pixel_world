name: Task 10 browser checkpoint migration

on:
  push:
    branches: ["feature/pixel-core-sanctuary"]
    paths:
      - ".github/workflows/task10-browser-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-core-sanctuary
          fetch-depth: 0
      - name: Migrate volcano browser smoke to sanctuary release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/volcano-browser-smoke.cjs')
          s = p.read_text()
          s = s.replace('pixel-world.progress.v7:', 'pixel-world.progress.v8:')
          s = s.replace('v7 progress checkpoint is missing', 'v8 progress checkpoint is missing')
          s = s.replace('assert.equal(beforeReload.version, 7);', 'assert.equal(beforeReload.version, 8);')
          s = s.replace('./src/game-20260903-volcano-20260905-upgrade.js', './src/game-20260910-sanctuary.js')
          s = s.replace('**/src/main-20260903-volcano-20260905-upgrade.js', '**/src/main-20260910-sanctuary.js')
          needle = '''async function enterSolo(page, nickname) {
            await page.locator("#nicknameInput").fill(nickname);
            await page.locator('[data-class-id="warrior"]').click();
            await page.locator('[data-play-mode="solo"]').click();
            await page.locator("#enterButton").click();
            await page.locator("#hud").waitFor({ state: "visible" });
          }'''
          replacement = '''async function skipFirstJourneyIfVisible(page) {
            const skip = page.locator("#firstJourneySkip");
            if (await skip.isVisible()) {
              await skip.click();
              await page.locator("#firstJourneyOverlay").waitFor({ state: "hidden" });
            }
          }

          async function enterSolo(page, nickname) {
            await page.locator("#nicknameInput").fill(nickname);
            await page.locator('[data-class-id="warrior"]').click();
            await page.locator('[data-play-mode="solo"]').click();
            await page.locator("#enterButton").click();
            await page.locator("#hud").waitFor({ state: "visible" });
            await skipFirstJourneyIfVisible(page);
          }'''
          if needle not in s:
              raise SystemExit('enterSolo pattern not found')
          s = s.replace(needle, replacement, 1)
          if 'pixel-world.progress.v7:' in s or 'main-20260903-volcano-20260905-upgrade.js' in s:
              raise SystemExit('stale volcano release reference remains')
          p.write_text(s)
          PY
          node --check tests/volcano-browser-smoke.cjs
          grep -q 'pixel-world.progress.v8:' tests/volcano-browser-smoke.cjs
          grep -q 'main-20260910-sanctuary.js' tests/volcano-browser-smoke.cjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/volcano-browser-smoke.cjs
          git commit -m "test: migrate volcano browser checkpoints to v8"
          git push origin HEAD:feature/pixel-core-sanctuary
