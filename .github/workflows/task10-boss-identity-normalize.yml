name: Task 10 boss identity normalize

on:
  push:
    branches: ["feature/pixel-core-sanctuary"]
    paths:
      - ".github/workflows/task10-boss-identity-normalize.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-core-sanctuary
          fetch-depth: 0
      - name: Normalize game-level boss identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/game-20260910-sanctuary.js')
          text = path.read_text()
          old = '''  renderableBoss() {\n    if (this.isOriginSpectator()) return null;\n    return this.coopBossController?.renderableBoss?.() || null;\n  }\n'''
          new = '''  renderableBoss() {\n    if (this.isOriginSpectator()) return null;\n    const view = this.coopBossController?.renderableBoss?.();\n    if (!view) return null;\n    const snapshot = this.coopBossController?.snapshot;\n    return {\n      ...view,\n      bossId: snapshot?.bossId || view.bossId || view.id || null,\n      encounterId: snapshot?.encounterId || view.encounterId || null,\n    };\n  }\n'''
          if old not in text:
              raise SystemExit('renderableBoss adapter marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check src/game-20260910-sanctuary.js
          node --test tests/game-sanctuary-combat.test.mjs
      - name: Commit normalized adapter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-20260910-sanctuary.js
          git commit -m "fix: normalize active boss identity"
          git push origin HEAD:feature/pixel-core-sanctuary
