name: Task 10 onboarding runtime

on:
  push:
    branches: ["feature/pixel-core-sanctuary"]
    paths:
      - ".github/workflows/task10-onboarding-runtime.yml"

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-core-sanctuary
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Apply onboarding runtime patch
        run: python .github/scripts/task10_onboarding_runtime_patch.py
      - name: Verify focused onboarding runtime
        run: |
          node --test tests/first-journey-state.test.mjs tests/first-journey-controller.test.mjs tests/first-journey-ui.static.test.cjs
          node --check src/game-20260910-sanctuary.js
          node --check src/main-20260910-sanctuary.js
      - name: Verify full Node suite
        run: node --test tests/*.test.mjs tests/*.static.test.cjs
      - name: Commit onboarding runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles-20260910-sanctuary.css src/main-20260910-sanctuary.js src/game-20260910-sanctuary.js
          git commit -m "feat: integrate first-player journey and guide"
          git push origin HEAD:feature/pixel-core-sanctuary
