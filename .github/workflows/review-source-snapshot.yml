name: Review source snapshot
on:
  push:
    branches: ["feature/pixel-core-sanctuary"]
    paths: [".github/workflows/review-source-snapshot.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive --format=tar -o /tmp/pixel-world-review.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-world-review-source
          path: /tmp/pixel-world-review.tar
          retention-days: 1
