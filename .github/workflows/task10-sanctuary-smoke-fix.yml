name: Task 10 sanctuary smoke key fix

on:
  push:
    branches: ["feature/pixel-core-sanctuary"]
    paths:
      - ".github/workflows/task10-sanctuary-smoke-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-core-sanctuary
          fetch-depth: 0
      - name: Use sanitized runtime nickname for v8 smoke reads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/sanctuary-browser-smoke.cjs')
          s = p.read_text()
          old = '''async function storedProgress(page, nickname) {
            return page.evaluate(activeNickname => {
              const key = `pixel-world.progress.v8:${encodeURIComponent(activeNickname)}`;
              const raw = localStorage.getItem(key);
              return raw ? JSON.parse(raw) : null;
            }, nickname);
          }'''
          new = '''async function storedProgress(page) {
            return page.evaluate(() => {
              const activeNickname = window.__sanctuaryGame?.player?.name;
              if (!activeNickname) return null;
              const key = `pixel-world.progress.v8:${encodeURIComponent(activeNickname)}`;
              const raw = localStorage.getItem(key);
              return raw ? JSON.parse(raw) : null;
            });
          }'''
          if old not in s:
              raise SystemExit('storedProgress helper pattern not found')
          s = s.replace(old, new, 1)
          count = s.count('storedProgress(page, nickname)')
          if count != 2:
              raise SystemExit(f'expected 2 nickname-based calls, found {count}')
          s = s.replace('storedProgress(page, nickname)', 'storedProgress(page)')
          if 'storedProgress(page, nickname)' in s:
              raise SystemExit('stale nickname-based storage lookup remains')
          p.write_text(s)
          PY
          node --check tests/sanctuary-browser-smoke.cjs
          grep -q 'window.__sanctuaryGame?.player?.name' tests/sanctuary-browser-smoke.cjs
      - name: Commit test harness fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/sanctuary-browser-smoke.cjs
          git commit -m "test: read sanctuary v8 save by runtime nickname"
          git push origin HEAD:feature/pixel-core-sanctuary
