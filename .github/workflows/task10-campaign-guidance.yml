name: Task 10 campaign guidance

on:
  push:
    branches: ["feature/pixel-core-sanctuary"]
    paths:
      - ".github/workflows/task10-campaign-guidance.yml"

permissions:
  contents: write

jobs:
  patch-campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-core-sanctuary
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Apply campaign guidance patch
        run: python .github/scripts/task10_campaign_patch.py
      - name: Verify focused campaign guidance
        run: |
          node --test tests/campaign-objective.test.mjs tests/aren-dialogue.test.mjs
          node --check src/game-20260910-sanctuary.js
      - name: Verify full Node suite
        run: node --test tests/*.test.mjs tests/*.static.test.cjs
      - name: Commit campaign guidance
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-20260910-sanctuary.js index.html
          git commit -m "feat: guide players from Aren through Chapter 4"
          git push origin HEAD:feature/pixel-core-sanctuary
