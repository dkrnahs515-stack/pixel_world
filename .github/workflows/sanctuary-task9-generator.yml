name: Sanctuary Task 9 Generator
on:
  push:
    branches: ["feature/pixel-core-sanctuary"]
    paths: [".github/workflows/sanctuary-task9-generator.yml"]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-core-sanctuary
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Apply Task 9 integration patch
        run: python .github/scripts/sanctuary_task9_patch.py
      - name: Harden ending input lock for lightweight harnesses
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/game-20260910-sanctuary.js')
          text = path.read_text()
          old = '    this.setInputEnabled?.(false);\n    return this.endingController.openChoice({'
          new = '    if (this.keys instanceof Set) this.setInputEnabled(false);\n    else this.inputEnabled = false;\n    return this.endingController.openChoice({'
          if old not in text:
              raise SystemExit('ending input-lock marker missing')
          path.write_text(text.replace(old, new, 1))
      - name: Verify focused Task 9
        run: |
          node --test tests/game-sanctuary-story.test.mjs tests/game-sanctuary-combat.test.mjs tests/game-sanctuary-ending.test.mjs tests/sanctuary-ending-controller.test.mjs tests/sanctuary-runtime-wiring.static.test.cjs
          node --check src/game-20260910-sanctuary.js
          node --check src/world-20260910-sanctuary.js
          node --check src/main-20260910-sanctuary.js
      - name: Verify full Node suite
        run: node --test tests/*.test.mjs tests/*.static.test.cjs
      - name: Commit and push Task 9 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game-20260910-sanctuary.js src/world-20260910-sanctuary.js src/main-20260910-sanctuary.js
          git commit -m "feat: wire sanctuary combat endings and spectator flow"
          git push origin HEAD:feature/pixel-core-sanctuary
