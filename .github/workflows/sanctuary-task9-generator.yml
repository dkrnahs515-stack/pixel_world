name: Sanctuary Task 9 Generator
on:
  push:
    branches: ["feature/pixel-core-sanctuary"]
    paths: [".github/workflows/sanctuary-task9-generator.yml"]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-core-sanctuary
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Apply final Task 9 QA wiring
        run: python .github/scripts/sanctuary_task9_qa_patch.py
      - name: Verify focused Task 9
        run: |
          node --test \
            tests/game-sanctuary-story.test.mjs \
            tests/game-sanctuary-combat.test.mjs \
            tests/game-sanctuary-ending.test.mjs \
            tests/game-qa.test.mjs \
            tests/qa-mode.test.mjs \
            tests/qa-ui.static.test.cjs \
            tests/sanctuary-qa-mode.test.mjs \
            tests/sanctuary-game-qa.test.mjs \
            tests/sanctuary-qa-ui.static.test.cjs \
            tests/sanctuary-ending-controller.test.mjs \
            tests/sanctuary-runtime-wiring.static.test.cjs
          node --check src/game-20260910-sanctuary.js
          node --check src/world-20260910-sanctuary.js
          node --check src/main-20260910-sanctuary.js
          node --check src/qa-mode-20260910-sanctuary.js
      - name: Verify full Node suite
        run: node --test tests/*.test.mjs tests/*.static.test.cjs
      - name: Commit and push final Task 9 QA integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/game-20260910-sanctuary.js \
            src/main-20260910-sanctuary.js \
            index.html \
            tests/qa-ui.static.test.cjs \
            tests/qa-mode.test.mjs
          git commit -m "feat: complete sanctuary QA integration"
          git push origin HEAD:feature/pixel-core-sanctuary
